<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ── App identity ──────────────────────────────────────────── -->
    <title>Realm Rich Reporter</title>
    <meta name="description" content="Family Finance Tracker — track income, expenses and transfers across all family members" />
    <meta name="author" content="BuildMyWeb-Tech" />
    <meta name="keywords" content="finance, family, tracker, budget, expenses" />

    <!-- ── PWA / installability ──────────────────────────────────── -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#22c55e" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- ── Apple PWA meta ────────────────────────────────────────── -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/icons/icon-144x144.png" />

    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="32x32"   href="/icons/icon-96x96.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png" />
    <meta name="msapplication-TileColor" content="#22c55e" />
